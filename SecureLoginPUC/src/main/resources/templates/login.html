<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <title>Login Page</title>
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-900 p-6">

  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl flex overflow-hidden">
    <div class="hidden md:flex md:w-1/2 relative bg-slate-800 p-8 flex-col justify-between">
      <div class="p-2 absolute inset-0 bg-white flex items-center justify-center">
        <img th:src="@{/images/puc_image.jpg}" alt="Puc Minas" class="w-full h-full object-cover rounded-2xl">
      </div>

      <div class="relative z-10 w-15 h-auto">
        <img th:src="@{/images/logo_puc.png}" alt="Logo PUC Minas">
      </div>

      <div class="absolute top-8 right-10 z-10 text-white">
        <h1 class="text-3xl font-extrabold leading-tight mb-4">
          SUA JORNADA<br>
          COMEÇA AQUI!<br>
        </h1>
      </div>
    </div>

    <div class="w-full md:w-1/2 p-8 sm:p-12 flex flex-col justify-center">
      <h2 class="text-2xl font-bold mb-1">Bem-vindo de volta!</h2>
      <p class="text-sm text-slate-500 mb-6">Bem-vindo de volta! Insira seus dados.</p>

      <form th:action="@{/login}" method="post" class="login-form" novalidate>
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="email" name="email" placeholder="Digite seu email"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-transparent">
          <span id="emailError" class="error-message hidden text-xs text-red-500 mt-1"></span>
        </div>

        <div class="mb-1">
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
          <div class="relative">
            <input type="password" id="password" name="password" placeholder="Digite sua senha"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-transparent pr-10">
            <button type="button" id="toggle-password"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i id="eye-icon" class="w-4 h-4" data-lucide="eye-off"></i>
            </button>
          </div>
          <span id="passwordError" class="error-message hidden text-xs text-red-500 mt-1"></span>
        </div>
        <a th:href="@{/recoverpassword}" class="text-sm font-semibold text-teal-700 hover:underline">Esqueceu a
          senha?</a>


        <button type="submit"
          class="mt-4 w-full bg-teal-800 hover:bg-teal-900 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors">
          Entrar
        </button>
      </form>

      <p class="text-center text-sm text-slate-500 mt-6">
        Não tem uma conta?
        <a th:href="@{/register}" class="font-semibold text-slate-900 hover:underline">Cadastre-se</a>
      </p>
    </div>

  </div>

  <script>

    lucide.createIcons();
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("toggle-password");
    togglePassword.addEventListener("click", () => {
      if (password.type === "password") {
        password.type = "text";
        togglePassword.innerHTML = `<i data-lucide="eye" class="w-4 h-4"></i>`;
      } else {
        password.type = "password";
        togglePassword.innerHTML = `<i data-lucide="eye-off" class="w-4 h-4"></i>`;
      }
      lucide.createIcons();
    });

    const form = document.querySelector("form");
    const email = document.getElementById("email");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    form.addEventListener("submit", function (event) {
      let valido = true;
      emailError.classList.add("hidden");
      passwordError.classList.add("hidden");
      emailError.textContent = ""; passwordError.textContent = "";
      passwordError.textContent = "";
      if (email.value.trim() === "") {
        emailError.textContent = "Informe seu e-mail.";
        emailError.classList.remove("hidden");
        valido = false;
      } else if (!emailRegex.test(email.value)) {
        emailError.textContent = "Informe um e-mail válido.";
        emailError.classList.remove("hidden");
        valido = false;
      }
      if (password.value.trim() === "") {
        passwordError.textContent = "Informe sua senha.";
        passwordError.classList.remove("hidden");
        valido = false;
      }
      if (!valido) {
        event.preventDefault();
      }
    });

  </script>

</body>

</html>
