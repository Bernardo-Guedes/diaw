<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Reset Password Page</title>
</head>
 
<body class="min-h-screen flex items-center justify-center bg-slate-900 p-6">
 
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl flex overflow-hidden">
        <div class="hidden md:flex md:w-1/2 relative bg-slate-800 p-8 flex-col justify-between">
            <div class="p-2 absolute inset-0 bg-white flex items-center justify-center">
                <img th:src="@{/images/puc_image.jpg}" alt="Puc Minas" class="w-full h-full object-cover rounded-2xl">
            </div>
 
            <div class="relative z-10 w-10 h-auto">
                <img th:src="@{/images/logo_puc.png}" alt="Logo PUC Minas">
            </div>
 
            <div class="absolute top-8 right-8 z-10 text-white">
                <h1 class="text-3xl font-extrabold leading-tight mb-4">
                    SUA PRIMEIRA<br>
                    AVENTURA<br>
                    TE ESPERA!
                </h1>
                <p class="text-sm text-slate-300">
                    Sua jornada começa aqui.
                </p>
            </div>
        </div>
 
        <div class="w-full md:w-1/2 p-8 sm:p-12 flex flex-col justify-center">
            <div class="flex gap-3">
                <a class="mt-3" th:href="@{/login}">
                    <i id="circle-arrow-left-icon" class="w-6 h-6" data-lucide="circle-arrow-left"></i>
                </a>
                <div>
                    <h2 class="text-2xl font-bold mb-1">Nova senha</h2>
                    <p class="text-sm text-slate-500 mb-6">Defina uma nova senha para sua conta.</p>
                </div>
 
            </div>
 
            <form th:action="@{/resetpassword}" method="post" class="login-form" id="reset-form" novalidate>
                <input type="hidden" name="token" th:value="${token}">
 
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Nova senha</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" placeholder="Digite sua nova senha"
                            minlength="8" required
                            class="w-full px-3 py-2 pr-10 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-transparent">
                        <button type="button" id="toggle-password"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <i data-lucide="eye-off" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <span id="passwordError" class="error-message hidden text-xs text-red-500 mt-1"></span>
                </div>
 
                <div class="mb-4">
                    <label for="confirm-password" class="block text-sm font-medium text-slate-700 mb-1">Confirmar
                        senha</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" name="confirmPassword"
                            placeholder="Confirme sua nova senha" minlength="8" required
                            class="w-full px-3 py-2 pr-10 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-transparent">
                        <button type="button" id="toggle-confirm-password"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <i data-lucide="eye-off" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <span id="confirmPasswordError" class="hidden text-xs text-red-500 mt-1"></span>
                </div>
 
                <button type="submit"
                    class="mt-4 w-full bg-teal-800 hover:bg-teal-900 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors">
                    Redefinir senha
                </button>
            </form>
        </div>
 
    </div>
 
    <script>
        lucide.createIcons();
 
        const password = document.getElementById("password");
        const togglePassword = document.getElementById("toggle-password");
        const confirmPassword = document.getElementById("confirm-password");
        const confirmTogglePassword = document.getElementById("toggle-confirm-password");
        const form = document.getElementById("reset-form");
 
        togglePassword.addEventListener("click", () => {
            if (password.type === "password") {
                password.type = "text";
                togglePassword.innerHTML = `<i data-lucide="eye" class="w-4 h-4"></i>`;
            } else {
                password.type = "password";
                togglePassword.innerHTML = `<i data-lucide="eye-off" class="w-4 h-4"></i>`;
            }
            lucide.createIcons();
        });
 
        confirmTogglePassword.addEventListener("click", () => {
            if (confirmPassword.type === "password") {
                confirmPassword.type = "text";
                confirmTogglePassword.innerHTML = `<i data-lucide="eye" class="w-4 h-4"></i>`;
            } else {
                confirmPassword.type = "password";
                confirmTogglePassword.innerHTML = `<i data-lucide="eye-off" class="w-4 h-4"></i>`;
            }
            lucide.createIcons();
        });
        
        const passwordError = document.getElementById("passwordError");
        const confirmPasswordError = document.getElementById("confirmPasswordError");
        const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

        form.addEventListener("submit", function (event) {
            let valido = true;
            passwordError.classList.add("hidden");
            confirmPasswordError.classList.add("hidden");
            passwordError.textContent = "";
            confirmPasswordError.textContent = "";

            if (password.value.trim() === "") {
                passwordError.textContent = "Informe sua senha.";
                passwordError.classList.remove("hidden");
                valido = false;
            } else if(!passwordRegex.test(password.value)){
                passwordError.textContent = "Informe uma senha válida.";
                passwordError.classList.remove("hidden");
                valido = false;
            }
            if (confirmPassword.value.trim() === "") {
                confirmPasswordError.textContent = "Confirme sua senha.";
                confirmPasswordError.classList.remove("hidden");
                valido = false;
            } else if (confirmPassword.value !== password.value) {
                confirmPasswordError.textContent = "As senhas não coincidem.";
                confirmPasswordError.classList.remove("hidden");
                valido = false;
            }
            if (!valido) {
                event.preventDefault();
            }
        });
        
    </script>
 
</body>
 
</html>
